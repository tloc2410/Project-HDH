name: Python desktop tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Tk display
        run: python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update(); root.destroy()"
      - name: Run unit and GUI integration tests
        run: python -m unittest discover -s tests -v
